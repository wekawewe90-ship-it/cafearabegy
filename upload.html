<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>رفع صورة</title>

<link rel="stylesheet" href="upload.css">

</head>

<body>

<div class="uploadBox">

<h2>📷 إرسال صورة</h2>

<div class="preview" id="preview">

اختر صورة

</div>

<input
type="file"
id="fileInput"
accept="image/*"
hidden>

<button
class="btn"
id="chooseBtn">

اختيار صورة

</button>

<button
class="btn"
id="uploadBtn">

رفع الصورة

</button>

<div id="progress">

</div>

</div>

<script type="module" src="upload.js"></script>

</body>

</html>
