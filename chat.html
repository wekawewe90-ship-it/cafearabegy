<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>Cafe Arab | الشات</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header>

<div class="logo">

☕ Cafe Arab

</div>

<div class="subtitle">

مرحباً بك فى المقهى العربى

</div>

</header>

<div class="container">

<div class="card">

<div
style="
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:15px;
">

<h2 id="userName">

👤 المستخدم

</h2>

<div
style="
display:flex;
gap:10px;
">

<button
id="notificationBtn"
class="btn"
style="
width:auto;
padding:10px 18px;
">

🔔

</button>
<button id="usersBtn" class="circleBtn">
👥
</button>

  <button
    id="clearChatBtn"
    class="circleBtn"
    style="display:none;"
    title="مسح الشات العام"
>
    🗑️
  </button>
  
<button
id="logoutBtn"
class="btn"
style="
width:auto;
padding:10px 18px;
">

🚪

</button>

</div>

</div>
<div id="notificationsMenu"
style="
display:none;
position:absolute;
top:70px;
left:20px;
width:300px;
max-height:350px;
overflow-y:auto;
background:#1f1f1f;
border:1px solid #444;
border-radius:12px;
padding:10px;
z-index:9999;
box-shadow:0 0 15px rgba(0,0,0,.4);
">

<div id="notificationsList">

لا توجد إشعارات

</div>

</div>

<hr>

<div
id="messages"
class="messages">

</div>

<div class="sendBox">

<button
id="imageBtn"
class="circleBtn">

📷

</button>

<input
type="file"
id="imageInput"
accept="image/*"
hidden>

  
<input
id="messageInput"
class="input"
type="text"
placeholder="اكتب رسالة...">

<button
id="sendBtn"
class="circleBtn">

➤

</button>

</div>
</div>

</div>

<footer>

© 2026 Cafe Arab

</footer>

<script type="module" src="chat.js"></script>

<script type="module" src="notifications.js"></script>

</body>

</html>
