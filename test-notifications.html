<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>اختبار</title>
</head>

<body>

<h2>اختبار الإشعارات</h2>

<div id="list">جارى التحميل...</div>

<script type="module">

import { auth } from "./firebase.js";

import {
onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js";

const list = document.getElementById("list");

list.innerHTML = "بدأ التنفيذ...";

onAuthStateChanged(auth, (user) => {

    if (user) {

        list.innerHTML = "✅ تم تسجيل الدخول";

    } else {

        list.innerHTML = "❌ غير مسجل دخول";

    }

});

</script>

</body>
</html>
